services:
  app:
    build: .
    ports:
      - 3000:3000
    volumes:
      - ./content:/content
      - .:/phishin
    tty: true
    stdin_open: true

  sidekiq:
    build: .
    depends_on:
      - pg
      - redis
    env_file:
      - .env
    command: sidekiq
    volumes:
      - /tmp:/storage

  pg:
    image: postgres:latest
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  # Self-hosted prerender service for dynamic rendering (see docs/dynamic_rendering.md).
  # Point the app at it with PRERENDER_SERVICE_URL=http://localhost:3001
  prerender:
    build: ./prerender
    ports:
      - 3001:3000

volumes:
  pg_data:
  redis_data:
