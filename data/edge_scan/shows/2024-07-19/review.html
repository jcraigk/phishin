<!doctype html>
<meta charset="utf-8">
<title>Track edge trim review</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">&#x2702;&#xFE0F;</text></svg>'>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 2rem auto; max-width: 1100px; }
  .row { border-bottom: 1px solid #ccc; padding: 1rem 0; }
  .head { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
  .meta { color: #666; }
  .banter { color: #205080; margin: .3rem 0 .3rem 1.6rem; }
  .audio { display: flex; gap: 1rem; align-items: center; margin: .4rem 0; flex-wrap: wrap; }
  .audio label { color: #666; font-size: 12px; }
  img { max-width: 100%; }
  #export { position: fixed; top: 1rem; right: 1rem; padding: .5rem 1rem; }
</style>
<button id="export">Export approved.json</button>
<h1>Track edge trim review (2 candidates)</h1>

<div class="row">
  <div class="head">
    <input type="checkbox" data-payload="{&quot;label&quot;: &quot;2024-07-19 Set 1 t08 46 Days&quot;, &quot;edge&quot;: &quot;trailing&quot;, &quot;mp3_url&quot;: &quot;https://phish.in/blob/5hk5zbs6dp0mimmbbx25gujogq22.mp3&quot;, &quot;share_url&quot;: &quot;https://phish.in/2024-07-19/46-days&quot;, &quot;music_boundary_s&quot;: 446.0, &quot;trim_start&quot;: 0.0, &quot;trim_end&quot;: 453.3}">
    <strong><a href="https://phish.in/2024-07-19/46-days" target="_blank">2024-07-19 Set 1 t08 46 Days</a></strong>
    <span class="meta">trailing edge &middot; run 36.0s &middot;
      cut 17.2s &middot; boundary 446.0s &middot; silence 5%, crowd 31%, speech 64%</span>
  </div>
  
  <div class="audio"><label>Trimmed result</label><audio controls preload="none" src="trimmed/clips/2024-07-19_Set_1_t08_46_Days_audition.mp3"></audio><label>Original tail</label><audio controls preload="none" src="trimmed/clips/2024-07-19_Set_1_t08_46_Days_original.mp3"></audio></div>
  <img src="plots/2024-07-19_Set_1_t08_46_Days_trailing.png" loading="lazy">
</div>
<div class="row">
  <div class="head">
    <input type="checkbox" data-payload="{&quot;label&quot;: &quot;2024-07-19 Encore t16 Harry Hood&quot;, &quot;edge&quot;: &quot;trailing&quot;, &quot;mp3_url&quot;: &quot;https://phish.in/blob/fpt78aodgy9ixo08t404a7sx9su5.mp3&quot;, &quot;share_url&quot;: &quot;https://phish.in/2024-07-19/harry-hood&quot;, &quot;music_boundary_s&quot;: 689.3, &quot;trim_start&quot;: 0.0, &quot;trim_end&quot;: 696.5999999999999}">
    <strong><a href="https://phish.in/2024-07-19/harry-hood" target="_blank">2024-07-19 Encore t16 Harry Hood</a></strong>
    <span class="meta">trailing edge &middot; run 25.9s &middot;
      cut 19.1s &middot; boundary 689.3s &middot; silence 9%, crowd 44%, speech 46%</span>
  </div>
  
  <div class="audio"><label>Trimmed result</label><audio controls preload="none" src="trimmed/clips/2024-07-19_Encore_t16_Harry_Hood_audition.mp3"></audio><label>Original tail</label><audio controls preload="none" src="trimmed/clips/2024-07-19_Encore_t16_Harry_Hood_original.mp3"></audio></div>
  <img src="plots/2024-07-19_Encore_t16_Harry_Hood_trailing.png" loading="lazy">
</div>

<script>
document.getElementById("export").onclick = () => {
  const approved = [...document.querySelectorAll("input:checked")]
    .map(cb => JSON.parse(cb.dataset.payload));
  const blob = new Blob([JSON.stringify(approved, null, 2)], {type: "application/json"});
  const a = Object.assign(document.createElement("a"),
    {href: URL.createObjectURL(blob), download: "approved.json"});
  a.click();
};
</script>
