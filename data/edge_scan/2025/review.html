  body { font: 14px/1.5 -apple-system, sans-serif; margin: 2rem auto; max-width: 1100px; }
  .row { border-bottom: 1px solid #ccc; padding: 1rem 0; }
  .head { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
  .meta { color: #666; }

</style>
<button id="export">Export approved.json</button>
<h1>Track edge trim review (0 candidates)</h1>

<h2>Flagged but not trimmed (2)</h2><div class="meta"><a href="https://phish.in/2025-04-26/the-squirming-coil" target="_blank">2025-04-26 Set 1 t08 The Squirming Coil</a> &middot; run 24.5s, cut 0.2s &mdash; left untouched</div><div class="meta"><a href="https://phish.in/2025-09-16/the-squirming-coil" target="_blank">2025-09-16 Set 1 t11 The Squirming Coil</a> &middot; run 24.0s, cut 0.5s &mdash; left untouched</div>
<script>
document.getElementById("export").onclick = () => {
  const approved = [...document.querySelectorAll("input:checked")]
    .map(cb => JSON.parse(cb.dataset.payload));
  const blob = new Blob([JSON.stringify(approved, null, 2)], {type: "application/json"});
  const a = Object.assign(document.createElement("a"),
    {href: URL.createObjectURL(blob), download: "approved.json"});
  a.click();
};
</script>
